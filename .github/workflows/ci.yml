name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install ruff && ruff check app
      - run: cd app && python -m unittest -v
      - name: Docker smoke test
        run: |
          docker build -t msd-hello .
          docker run -d --name hello -p 8080:8080 msd-hello
          for i in $(seq 1 10); do curl -fsS localhost:8080/health && break || sleep 1; done
          curl -fsS localhost:8080/

  scripts-and-units:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck deploy/healthcheck.sh
      - name: Install units exactly as cloud-init does
        run: |
          sudo useradd --system --shell /usr/sbin/nologin hello
          sudo install -Dm644 app/server.py /opt/hello/server.py
          sudo install -m755 deploy/healthcheck.sh /usr/local/bin/healthcheck.sh
          sudo install -m644 deploy/systemd/* /etc/systemd/system/
          sudo systemctl daemon-reload
      - name: Verify systemd units (fails on any error)
        run: sudo systemd-analyze verify --man=false /etc/systemd/system/hello.service /etc/systemd/system/healthcheck.service /etc/systemd/system/healthcheck.timer
      - name: Start service and run the real health check
        run: |
          sudo systemctl start hello
          sleep 2
          systemctl is-active hello
          sudo /usr/local/bin/healthcheck.sh && echo "healthcheck: OK"
      - name: Failure path - health check must detect and restart
        run: |
          sudo systemctl stop hello
          rc=0; sudo RETRY_SLEEP=1 /usr/local/bin/healthcheck.sh || rc=$?
          echo "healthcheck exit code: $rc (1 = restarted)"
          test "$rc" -eq 1
          systemctl is-active hello
          sudo journalctl -t healthcheck --no-pager

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - name: Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

  # Deployment is intentionally manual: no cloud credentials live in this repo.
  # To enable, add AWS creds as environment secrets, then run `terraform apply` here.
